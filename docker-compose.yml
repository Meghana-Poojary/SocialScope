# SocialScope big-data stack - everything runs in containers.
# Tuned to fit Docker Desktop's default ~4 GB VM on an 8 GB laptop: every JVM has a capped heap,
# Spark runs in local mode in one container, and the API container also serves the dashboard.
#
#   docker compose up -d --build        start the stack (first build takes a while)
#   ./scripts/docker_pipeline.ps1       run the pipeline (or scripts/docker_pipeline.sh)
#
# Dashboard + API  http://localhost:8000      (API docs: /docs)
# HDFS             http://localhost:9870      Neo4j  http://localhost:7474 (neo4j / socialscope123)
# Spark job UI     http://localhost:4040      (while a job runs)
name: socialscope

services:
  # ------------------------------------------------------------------ messaging
  kafka:
    image: apache/kafka:3.8.0
    ports: [ "127.0.0.1:9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes: [ "kafka:/var/lib/kafka/data" ]

  # ------------------------------------------------------------------ storage (HDFS)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    ports: [ "127.0.0.1:9870:9870", "127.0.0.1:9000:9000" ]
    environment: &hadoop-env
      CLUSTER_NAME: socialscope
      HADOOP_HEAPSIZE_MAX: 256m
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes: [ "namenode:/hadoop/dfs/name" ]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    depends_on: [ namenode ]
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9870"
    volumes: [ "datanode:/hadoop/dfs/data" ]

  # ------------------------------------------------------------------ processing (Spark)
  # Idle container; jobs are launched into it with spark-submit (see scripts/docker_pipeline.*)
  spark:
    build: { context: ., dockerfile: processing/Dockerfile }
    image: socialscope-spark:latest
    hostname: spark
    command: [ "tail", "-f", "/dev/null" ]
    ports: [ "127.0.0.1:4040:4040" ]
    volumes: [ ".:/app" ]
    depends_on: [ kafka, namenode ]
    environment:
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1200m
      SPARK_KAFKA_PACKAGE: ""            # connector jars are baked into the image
      KAFKA_BOOTSTRAP: kafka:29092
      HDFS_URL: hdfs://namenode:9000
      MONGO_URI: mongodb://mongo:27017
      ES_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687

  # ------------------------------------------------------------------ serving stores
  mongo:
    image: mongo:7.0
    command: [ "--wiredTigerCacheSizeGB", "0.25" ]
    ports: [ "127.0.0.1:27018:27017" ]          # 27018 on the host so it doesn't clash with a local MongoDB
    volumes: [ "mongo:/data/db" ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports: [ "127.0.0.1:9200:9200" ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    volumes: [ "es:/usr/share/elasticsearch/data" ]

  neo4j:
    image: neo4j:5.24-community
    ports: [ "127.0.0.1:7474:7474", "127.0.0.1:7687:7687" ]
    environment:
      NEO4J_AUTH: neo4j/socialscope123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    volumes: [ "neo4j:/data" ]

  # ------------------------------------------------------------------ API + dashboard
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: [ "127.0.0.1:8000:8000" ]
    depends_on: [ mongo, elasticsearch, neo4j ]
    environment:
      MONGO_URI: mongodb://mongo:27017
      ES_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687

volumes:
  kafka: {}
  namenode: {}
  datanode: {}
  mongo: {}
  es: {}
  neo4j: {}
